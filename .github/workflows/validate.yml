name: Check HopeAid Staff Portal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
      - name: Verify source parity and security controls
        run: |
          python3 - <<'PY'
          import base64, hashlib, re
          from pathlib import Path
          html=Path('index.html').read_text()
          js=Path('app.js').read_text()
          headers=Path('_headers').read_text()
          schema=Path('supabase/schema.sql').read_text()
          config=Path('config.js').read_text()
          inline=re.search(r'<script>([\s\S]*?)</script>',html)
          assert inline, 'Inline app script missing'
          assert inline.group(1)==js, 'index.html must mirror app.js exactly'
          digest=base64.b64encode(hashlib.sha256(js.encode()).digest()).decode()
          assert "'sha256-"+digest+"'" in headers, 'Missing/mismatched CSP script hash'
          assert "unsafe-inline" not in headers
          assert '/config.js' in html
          assert 'sb_publishable_' in config
          assert 'Explore sample dashboard' not in html
          assert 'Explore sample dashboard' not in js
          assert 'startDemo' not in js and 'state.demo' not in js
          assert 'const sample=' not in js
          assert 'Sign in securely' in html
          assert 'setNavOpen' in js
          assert 'aria-controls="staff-sidebar"' in html
          assert 'data-action="logout"' in js
          assert "signOut({scope:'local'})" in js
          assert 'Responsive authenticated staff navigation' in Path("branding.css").read_text()
          assert 'overflow-y:auto' in Path("branding.css").read_text()
          assert 'must_change_password boolean not null default true' in schema
          assert 'not p.must_change_password' in schema
          assert "state.authFlow='first-login'" in js
          assert "complete-initial-password" in js
          assert "create-staff" in js
          assert "getRandomValues" in js
          assert "temporary password" in js.lower()
          for table in ('staff_profiles','programmes','tasks','reports','attendance','announcements'):
            assert 'alter table public.'+table+' enable row level security' in schema
          print('PASS: JS parity, CSP integrity, RLS and first-login password rotation')
          PY
